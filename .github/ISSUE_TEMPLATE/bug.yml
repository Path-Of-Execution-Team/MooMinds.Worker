name: Bug report
description: A bug affecting this component
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and additional context
      description: Version, logs without secrets, screenshots, and related MooMinds issues.
    validations:
      required: false
